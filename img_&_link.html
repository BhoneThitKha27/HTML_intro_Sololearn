<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image and Link Example</title>
</head>
<body>
    <!-- Displaying Image -->
    <h2>My Favorite Animal</h2>
    <img src="https://via.placeholder.com/300" alt="Cute Cat">
    <p>This is a picture of a cute cat. I love cats!</p>

    <!-- Link Example -->
    <h2>Visit my favorite website</h2>
    <a href="https://www.example.com" target="_blank">Visit Example Website</a>
</body>
</html>
